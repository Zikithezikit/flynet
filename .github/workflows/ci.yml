name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev + gradient extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gradient]"

      - name: Lint (syntax check)
        run: make lint PYTHON=python

      - name: Docstrings (Google style)
        run: make docstyle PYTHON=python

      - name: Typecheck (mypy, strict config)
        run: make typecheck PYTHON=python

      - name: Tests
        run: make test-quiet PYTHON=python
        env:
          MPLBACKEND: Agg
