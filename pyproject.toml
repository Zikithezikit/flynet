[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flynet"
version = "0.1.0"
description = "Spiking neural network library based on the Drosophila brain connectome"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Yoav Haimov" }]
keywords = ["snn", "spiking-neural-network", "drosophila", "connectome", "neuromorphic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
neuprint = ["neuprint-python>=0.6", "pandas>=1.5"]
full = ["neuprint-python>=0.6", "pandas>=1.5", "networkx>=3.0", "Pillow>=9.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["flynet[full,dev]"]

[project.scripts]
flynet = "flynet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flynet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
