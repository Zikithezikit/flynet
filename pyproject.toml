[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flynet"
version = "0.1.0"
description = "Spiking neural network library based on the Drosophila brain connectome"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Yoav Haimov", email = "haimovyoav.work@gmail.com" }]
keywords = [
  "snn",
  "spiking-neural-network",
  "drosophila",
  "connectome",
  "neuromorphic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.6"]

[project.optional-dependencies]
neuprint = ["neuprint-python>=0.6", "pandas>=1.5"]
full = ["neuprint-python>=0.6", "pandas>=1.5", "networkx>=3.0", "Pillow>=9.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.5", "pydocstyle>=6.3"]
gradient = ["jax>=0.4", "jaxlib>=0.4", "optax>=0.2"]
all = ["flynet[full,dev,gradient]"]

[project.scripts]
flynet = "flynet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flynet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Strict type checking; `make typecheck` runs mypy with this config.
[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
